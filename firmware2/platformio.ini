; PlatformIO project — custom quadrature-drive controller for RCA 10W707
;
; From-scratch replacement for the K3NG build in ../firmware:
; two-phase sine drive (TDA7294 audio amps) instead of relays + run capacitor.
;
; Build:          pio run
; Flash:          pio run --target upload
; Serial monitor: pio device monitor

[platformio]
default_envs = nano_new

[env]
framework     = arduino
platform      = atmelavr
lib_deps      = arduino-libraries/LiquidCrystal@^1.0.7
monitor_speed = 9600

; CH340 Nano from hestore.hu (prod_10044467) — old bootloader, 57600 upload
[env:nano_old]
board        = nanoatmega328
upload_speed = 57600

; New-bootloader variant (post-2018 genuine Arduino Nano)
[env:nano_new]
board        = nanoatmega328new
upload_speed = 115200
