  <!-- footer notes -->
  <text x="80" y="736" font-size="12" fill="#666">One channel shown — build two. Shared once: +52 V, GND, VREF divider (may be shared), the D6 enable line + its 10k pull-down (RCs sequence STBY/MUTE, datasheet Fig. 17).</text>
  <text x="80" y="754" font-size="12" fill="#666">Inputs: D9 (sin) / D10 (cos) through the two-pole RC (62.5 kHz carrier down to ~65 mV p-p at the output). Outputs: tower wire 1 (winding A) / tower wire 4 (winding B). Motor common = tower wire 5 = GND. Gain 1+22k/1.2k ≈ 19.3.</text>
